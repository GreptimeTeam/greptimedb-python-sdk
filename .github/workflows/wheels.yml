name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
          - name: windows-x64
            os: windows-latest
            target: x64
            manylinux: "off"
          - name: macos-arm64
            os: macos-latest
            target: aarch64
            manylinux: "off"
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist --compatibility pypi
          sccache: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Smoke test
        run: |
          python -m pip install --no-index --find-links dist greptimedb-ingester
          python -m pip install pytest
          python -m pytest -o addopts=

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist/*.whl

  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start GreptimeDB
        run: |
          docker run -d --name greptimedb -p 4000:4000 -p 4001:4001 \
            greptime/greptimedb:latest \
            standalone start --http-addr 0.0.0.0:4000 --rpc-bind-addr 0.0.0.0:4001
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs greptimedb
          exit 1

      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5

      - name: Integration tests
        env:
          GREPTIMEDB_GRPC: 127.0.0.1:4001
          GREPTIMEDB_HTTP: http://127.0.0.1:4000
        run: |
          uv python pin 3.10
          uv sync --group dev
          uv run maturin develop
          uv run pytest -m integration -o addopts=

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Attach wheels to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.whl --clobber
          else
            gh release create "$tag" dist/*.whl --title "$tag" --generate-notes
          fi

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
