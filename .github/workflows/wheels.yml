name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            target: x86_64
            manylinux: "2_28"
            test: true
          - name: linux-aarch64
            target: aarch64
            manylinux: "2_28"
            test: false
          - name: windows-x64
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            test: false
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-dlltool
        if: matrix.platform.target == 'x86_64-pc-windows-msvc'
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist --compatibility pypi
          sccache: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Set up Python
        if: matrix.platform.test
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run tests
        if: matrix.platform.test
        run: |
          python -m pip install --no-index --find-links dist greptimedb-ingester
          python -m pip install pytest
          python -m pytest

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist/*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Attach wheels to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.whl --clobber
          else
            gh release create "$tag" dist/*.whl --title "$tag" --generate-notes
          fi
