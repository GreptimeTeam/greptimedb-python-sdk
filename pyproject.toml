[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "greptimedb-ingester"
version = "0.1.2"
description = "GreptimeDB Python client with optional gRPC and PostgreSQL COPY backends"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["greptimedb", "database", "ingest", "grpc", "postgres"]

[project.urls]
Repository = "https://github.com/GreptimeTeam/greptimedb-python-sdk"

[project.optional-dependencies]
grpc = ["greptimedb-ingester-grpc==0.1.2"]
postgres = ["psycopg2-binary>=2.9.10,<3"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["greptimedb_ingester*"]

[tool.setuptools.package-data]
greptimedb_ingester = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]
addopts = "-m 'not integration'"
markers = ["integration: writes requiring GREPTIMEDB_GRPC or GREPTIMEDB_POSTGRES"]

[tool.uv.sources]
greptimedb-ingester-grpc = { path = "packages/grpc", editable = true }
